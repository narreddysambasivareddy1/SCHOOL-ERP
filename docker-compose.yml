version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-8432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schoolerp}
      POSTGRES_USER: ${POSTGRES_USER:-schoolerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schoolerp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8301}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-schoolerp};Username=${POSTGRES_USER:-schoolerp};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?JWT_SECRET required}
      Jwt__Issuer: ${JWT_ISSUER:-schoolerp}
      Jwt__Audience: ${JWT_AUDIENCE:-schoolerp-clients}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    expose:
      - "8080"

  school-website:
    build:
      context: ./school-website
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SCHOOL_WEBSITE_PORT:-8181}:80"
    networks:
      - external

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8300}:80"
    networks:
      - internal

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8380}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - internal
      - external

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
